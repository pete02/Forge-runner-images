name: Publish CI images

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "ci-images/**"
      - ".forgejo/workflows/publish-ci-images.yaml"

jobs:
  publish:
    name: Build and publish CI images
    runs-on: docker-ci

    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGES: "go-ci rust-ci nixos-ci docker-ci"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker access
        run: docker info

      - name: Log in to Docker Hub
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Build images
        run: |
          for image in $IMAGES; do
            echo "Building $image..."
            docker build \
              --tag "$DOCKERHUB_USERNAME/$image:latest" \
              "ci-images/$image"
          done

      - name: Push latest and commit-tagged images
        run: |
          for image in $IMAGES; do
            repository="$DOCKERHUB_USERNAME/$image"

            echo "Pushing $image:latest..."
            docker image push \
              --platform linux/amd64 \
              "$repository:latest"

            echo "Tagging $image:$GITHUB_SHA..."
            docker tag \
              "$repository:latest" \
              "$repository:$GITHUB_SHA"

            echo "Pushing $image:$GITHUB_SHA..."
            docker image push \
              --platform linux/amd64 \
              "$repository:$GITHUB_SHA"
          done

      - name: Log out of Docker Hub
        if: always()
        run: docker logout