
name: Publish CI images

on:
  push:
    branches:
      - master
    paths:
      - "ci-images/**"
      - "docker-compose.ci-images.yml"
      - ".forgejo/workflows/publish-ci-images.yaml"

jobs:
  publish:
    name: Build and publish CI images
    runs-on: docker-ci

    env:
      DOCKER_HOST: tcp://docker-in-docker:2375
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Docker CLI and Compose
        run: |
          apt-get update
          apt-get install -y docker.io docker-compose

      - name: Verify Docker access
        run: docker info

      - name: Log in to Docker Hub
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Build images
        run: |
          docker-compose \
            -f docker-compose.ci-images.yml \
            build

      - name: Push latest images
        run: |
          for image in go-ci rust-ci nixos-ci; do
            docker image push \
              --platform linux/amd64 \
              "$DOCKERHUB_USERNAME/$image:latest"
          done

      - name: Tag images with commit SHA
        run: |
          for image in go-ci rust-ci nixos-ci docker-ci; do
            docker tag \
              "$DOCKERHUB_USERNAME/$image:latest" \
              "$DOCKERHUB_USERNAME/$image:$GITHUB_SHA"

            docker image push \
              --platform linux/amd64 \
              "$DOCKERHUB_USERNAME/$image:$GITHUB_SHA"
          done

      - name: Tag images with commit SHA
        run: |
          for image in go-ci rust-ci nixos-ci; do
            docker tag \
              "$DOCKERHUB_USERNAME/$image:latest" \
              "$DOCKERHUB_USERNAME/$image:$GITHUB_SHA"

            docker push "$DOCKERHUB_USERNAME/$image:$GITHUB_SHA"
          done

      - name: Log out of Docker Hub
        if: always()
        run: docker logout
